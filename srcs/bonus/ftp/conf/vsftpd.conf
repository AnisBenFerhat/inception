listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

local_umask=002

chroot_local_user=YES
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40005

# Fix for VSCode Tunneling / NAT
# Force the server to report localhost to the FTP client
pasv_address=127.0.0.1
pasv_addr_resolve=NO

pasv_promiscuous=YES
user_sub_token=$USER
local_root=/var/www/html

seccomp_sandbox=NO
